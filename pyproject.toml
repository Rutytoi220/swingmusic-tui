[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swingmusic-tui"
version = "0.1.0"
description = "A sleek, keyboard-first (HJKL) terminal client for Swing Music with native MPRIS support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "httpx>=0.27.0",
    "dbus-next>=0.2.3",
]

[project.scripts]
swingmusic-tui = "swingmusic_tui.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/swingmusic_tui"]
